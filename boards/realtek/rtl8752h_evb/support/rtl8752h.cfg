#
# Realtek rtl8752h series: ARM Cortex-M0+
#

source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME rtl8752h
}

set _ENDIAN little

# Work-area is a space in RAM used for flash programming
if { [info exists WORKAREASIZE] } {
	set _WORKAREASIZE $WORKAREASIZE
} else {
	set _WORKAREASIZE 0x4000
}
set _WORKAREASTART   0x200000

#jtag scan chain
if { [info exists CPUTAPID] } {
	set _CPUTAPID $CPUTAPID
} else {
	set _CPUTAPID 0x0BC11477
}

# Declare a TAP and create a DAP
swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# Target
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap

# Work-area
$_TARGETNAME configure -work-area-phys $_WORKAREASTART -work-area-size $_WORKAREASIZE -work-area-backup 0

# flash
set _FLASHNAME $_CHIPNAME.flash
set _FLASHADDR  0x00800000
# Allow overriding the flash size, and flash size will can be probed
if { [info exists FLASH_SIZE] } {
	set _FLASH_SIZE $FLASH_SIZE
} else {
	# autodetect size
	set _FLASH_SIZE 0x00100000
}
flash bank $_FLASHNAME rtl8752h $_FLASHADDR $_FLASH_SIZE 0 0 $_TARGETNAME

adapter speed 1000
